[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "pshell"
version = "0.1.0"
description = "Custom Python shell"
authors = [{name = "Your Name", email = "your@email.com"}]
requires-python = ">=3.6"
dependencies = [
    "colorama>=0.4.4",
    "prompt_toolkit>=3.0.0"
]

[project.scripts]
psh = "psh:main"
